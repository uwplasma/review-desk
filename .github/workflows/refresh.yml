name: Refresh public data
on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: read
  checks: read
  actions: read
  statuses: read
concurrency:
  group: public-data
  cancel-in-progress: false
jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Collect public pull requests and CI runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .cache
          prior=$(git ls-remote origin refs/heads/data | cut -f1)
          if [[ -n "$prior" ]]; then
            git fetch --depth=1 origin refs/heads/data
            git show FETCH_HEAD:data.json > .cache/dashboard.json
          elif [[ -f dist/data.json ]]; then
            cp dist/data.json .cache/dashboard.json
          fi
          cp .cache/dashboard.json .cache/previous.json 2>/dev/null || true
          python3 collect.py --output .cache/fresh.json --cache .cache/dashboard.json
          python3 timing.py .cache/fresh.json --previous .cache/previous.json
          printf 'PRIOR_DATA=%s\n' "$prior" >> "$GITHUB_ENV"
      - name: Publish the current feed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          blob=$(git hash-object -w .cache/fresh.json)
          tree=$(printf '100644 blob %s\tdata.json\n' "$blob" | git mktree)
          commit=$(git commit-tree "$tree" -m "Refresh public review data")
          git push --force-with-lease="refs/heads/data:$PRIOR_DATA" origin "$commit:refs/heads/data"
